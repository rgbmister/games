          for (let pid in connections) {
            const k = connections[pid].keys;
            if (k.up) up++;
            if (k.down) down++;
            if (k.left) left++;
            if (k.right) right++;
          }
          if (hostKeys.up) up++;
          if (hostKeys.down) down++;
          if (hostKeys.left) left++;
          if (hostKeys.right) right++;
          const totalPlayers = Object.keys(connections).length + 1;
          const total = up + down + left + right;
          const pctUp = total > 0 ? Math.round(up/total*100) : 0;
          const pctDown = total > 0 ? Math.round(down/total*100) : 0;
          const pctLeft = total > 0 ? Math.round(left/total*100) : 0;
          const pctRight = total > 0 ? Math.round(right/total*100) : 0;

          const activeCount = up + down + left + right;
          if (activeCount > 0) {
            const avgX = (right - left) / activeCount;
            const avgZ = (down - up) / activeCount;
            const targetRotX = avgZ * CONFIG.maxTilt;
            const targetRotZ = -avgX * CONFIG.maxTilt;
            currentRotX += (targetRotX - currentRotX) * CONFIG.smoothing;
            currentRotZ += (targetRotZ - currentRotZ) * CONFIG.smoothing;
          } else {
            currentRotX *= 0.95;
            currentRotZ *= 0.95;
          }
          tableGroup.rotation.x = currentRotX;
          tableGroup.rotation.z = currentRotZ;
          physicsUpdate(dt);

          let active = 0;
          for (let pid in connections) {
            const k = connections[pid].keys;
            if (k.up || k.down || k.left || k.right) active++;
          }
          if (hostKeys.up || hostKeys.down || hostKeys.left || hostKeys.right) active++;
          hostStats = { up: pctUp, down: pctDown, left: pctLeft, right: pctRight, active: active, total: totalPlayers };
          updateHUDStats(hostStats);
        }

        // Title faces the camera (yaw only, stays upright), plus clamped mouse rotation/tilt
        if (titleGroup.visible) {
            titleGroup.rotation.y = Math.atan2(
                camera.position.x - titleGroup.position.x,
                camera.position.z - titleGroup.position.z
            ) + titleRotOffset;
            titleGroup.rotation.x = -0.2 + titleTiltOffset;
            ball.rotation.y += 0.015;
        }

        frameCount++;
        if (frameCount % 2 === 0) {
          const ballWorld = new THREE.Vector3();
          ball.getWorldPosition(ballWorld);
          cubeCamera.position.copy(ballWorld);
          const wasVisible = ball.visible;
          ball.visible = false;
          cubeCamera.update(renderer, scene);
          ball.visible = wasVisible;
        }
        particles.update(1/60);

        if (frameCount % 2 === 0) {
          broadcastState();
        }

        renderer.render(scene, camera);
        updateCamera();
        drawMinimap();

        requestAnimationFrame(hostLoop);
      }

      function broadcastState(overrideData = null) {
        let state;
        if (overrideData) {
            state = overrideData;
        } else {
            state = {
              type: 'state',
              ballX: ball.position.x,
              ballY: ball.position.y,
              ballZ: ball.position.z,
              rotX: currentRotX,
              rotZ: currentRotZ,
              level: currentLevel,
              gameActive: gameActive,
              ballColor: ballColor,
              stats: hostStats,
            };
        }
        for (let pid in connections) {
          connections[pid].conn.send(state);
        }
      }

      hostLoop();

    } else {
      // ---- CLIENT ----
      hostPanel.style.display = 'none';
      clientPanel.style.display = 'flex';
      peerIdInput.focus();

      // Enter in the host-ID box connects (same as clicking Connect)
      peerIdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          connectBtn.click();
        }
      });

      // SMOOTHING VARIABLES
      let targetPos = new THREE.Vector3(0, CONFIG.ballRadius, 0);
      let targetRotX = 0, targetRotZ = 0;

      let clientPeer = new Peer();
      let hostConn = null;
      let connected = false;

      clientPeer.on('open', () => {
        connectionStatus.textContent = '🔗 Enter Host ID';
      });

      connectBtn.addEventListener('click', () => {
        const id = peerIdInput.value.trim();
        if (!id) return;
        if (hostConn) { hostConn.close(); hostConn = null; }
        const conn = clientPeer.connect(id, { reliable: true });
        hostConn = conn;
        conn.on('open', () => {
          connected = true;
          peerIdInput.style.display = 'none';
          connectBtn.style.display = 'none';
          connectionStatus.textContent = '✅ Connected – waiting for host to start…';
          sendKeys();
        });
        conn.on('data', (data) => {
          // --- LEVEL DATA (host started) ---
          if (data.type === 'levelData') {
            currentLevel = data.level;
            buildLevelFromData(data);
            hudPanel.style.display = 'block';
            minimapCanvas.style.display = 'block';
            updateHUD();
            hideOverlay();
            titleGroup.visible = false;
            prepareGameBall();
            connectionStatus.textContent = '✅ Connected – Playing';
          }
          // --- TRANSITION (level complete) ---
          else if (data.type === 'transition') {
            showOverlay(data.msg, data.sub, 9999);
          }
          // --- STATE ---
          else if (data.type === 'state') {
            targetPos.x = data.ballX;
            targetPos.y = data.ballY || CONFIG.ballRadius;
            targetPos.z = data.ballZ;
            targetRotX = data.rotX;
            targetRotZ = data.rotZ;
            
            if (data.ballColor) {
              ballColor = data.ballColor;
              if (ballColor === 'blue') ball.material.color.set(0x2244ff);
              else ball.material.color.set(0xccccdd);
            }

            // If host starts game from title and we haven't gotten maze yet
            gameActive = data.gameActive;
            if (data.stats) updateHUDStats(data.stats);
            if (data.gameActive) {
              hudPanel.style.display = 'block';
              minimapCanvas.style.display = 'block';
            }
            if (connected) {
              connectionStatus.textContent = gameActive ? '✅ Connected – Playing' : '✅ Connected – waiting for host to start…';
            }
          }
        });
        conn.on('close', () => {
          connected = false;
          peerIdInput.style.display = '';
          connectBtn.style.display = '';
          peerIdInput.disabled = false;
          connectBtn.disabled = false;
          connectionStatus.textContent = '❌ Disconnected';
        });
      });

      let clientKeys = { up: false, down: false, left: false, right: false };
      function sendKeys() {
        if (connected && hostConn) {
          hostConn.send({ type: 'keys', keys: clientKeys });
        }
      }
      document.addEventListener('keydown', (e) => {
        const dir = keyDir(e);
        if (!dir) return;
        e.preventDefault();
        clientKeys[dir] = true;
        sendKeys();
      });
      document.addEventListener('keyup', (e) => {
        const dir = keyDir(e);
        if (!dir) return;
        e.preventDefault();
        clientKeys[dir] = false;
        sendKeys();
      });

      setInterval(() => { sendKeys(); }, 30);

      function clientRender() {
        frameCount++;
        if (frameCount % 2 === 0) {
          const ballWorld = new THREE.Vector3();
          ball.getWorldPosition(ballWorld);
          cubeCamera.position.copy(ballWorld);
          const wasVisible = ball.visible;
          ball.visible = false;
          cubeCamera.update(renderer, scene);
          ball.visible = wasVisible;
        }
        particles.update(1/60);
        
        // Smoothly interpolate to target position (never during the title screen)
        if (!titleGroup.visible) {
          ball.position.x += (targetPos.x - ball.position.x) * 0.3;
          ball.position.y += (targetPos.y - ball.position.y) * 0.3;
          ball.position.z += (targetPos.z - ball.position.z) * 0.3;
        }

        // Keep the ball glow following the ball (host does this in physics)
        ballLight.position.copy(ball.position);
        ballLight.position.y = ball.position.y + 0.5;

        currentRotX += (targetRotX - currentRotX) * 0.3;
        currentRotZ += (targetRotZ - currentRotZ) * 0.3;
        tableGroup.rotation.x = currentRotX;
        tableGroup.rotation.z = currentRotZ;

        // Title faces the camera (yaw only, stays upright), plus clamped mouse rotation/tilt
        if (titleGroup.visible) {
            titleGroup.rotation.y = Math.atan2(
                camera.position.x - titleGroup.position.x,
                camera.position.z - titleGroup.position.z
            ) + titleRotOffset;
            titleGroup.rotation.x = -0.2 + titleTiltOffset;
            ball.rotation.y += 0.015;
        }

        renderer.render(scene, camera);
        updateCamera();
        drawMinimap();

        requestAnimationFrame(clientRender);
      }
      
      clientRender();

      currentLevel = 1;
      updateHUD(); 
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateCamera();
    console.log('Tilt Collective loaded.');
  </script>
</body>
